<!DOCTYPE html>
<html lang="en" oncontextmenu="return false">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#1bb566"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Pemutar Musik</title>
  <link rel="icon" href="https://kkykrnwn.github.io/find-me/images/icon.png" type="image/png" />
  <style>
    :root {
      --glow1: #ff0080; --glow2: #ff8000; --glow3: #00ffcc; --glow4: #0080ff;
      --bg-color: #121212; --text-color: #ffffff; --hacker-color: #00ff00;
      --panel-bg: rgba(255, 255, 255, 0.08); --lyric-color: #00ffcc;
      --bar-bg: rgba(255, 255, 255, 0.2);
      --vinyl-disk-color: #080808;
      --tonearm-color: #d1d1d1;
      --tonearm-holder: #222;
    }
    body.light { 
      --bg-color: #ffffff; --text-color: #000000; --hacker-color: #000000;
      --panel-bg: rgba(0, 0, 0, 0.05); --lyric-color: #ff0080;
      --bar-bg: rgba(0, 0, 0, 0.2);
      --vinyl-disk-color: #1a1a1a;
    }
    * { 
      box-sizing: border-box; 
      touch-action: manipulation; 
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }
    body {
      font-family: sans-serif; margin: 0; padding: 0;
      background-color: var(--bg-color); transition: 0.3s; color: var(--text-color);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; overflow-x: hidden;
    }
    .music-container {
      width: 90%; max-width: 420px; text-align: center;
      padding: 15px; /* Kurangi dari 25px ke 15px */ 
      border-radius: 20px; background-color: var(--panel-bg);
      position: relative; box-shadow: 0 0 25px var(--glow1);
      animation: glowRGBBright 5s ease-in-out infinite; 
      margin: 10px; z-index: 5;
      border: 2px solid var(--glow1);
      overflow: hidden;
    }
    .vu-meter-pro {
      position: absolute; top: 15px; left: 15px;
      display: flex; gap: 6px; height: 75px; 
      align-items: flex-end; z-index: 10; padding: 6px; 
      background: rgba(0,0,0,0.4); border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .vu-bar-unit { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; width: 11px; }
    .vu-bar-fill {
      width: 100%; height: 2%; border-radius: 2px;
      transition: height 0.1s ease-out;
      background: linear-gradient(to top, #00ff00 0%, #ffff00 50%, #ff0000 100%);
    }
    .vu-small-label { font-size: 8px; margin-top: 4px; color: var(--hacker-color); font-weight: bold; font-family: monospace; }
    @keyframes glowRGBBright {
      0%   { box-shadow: 0 0 25px var(--glow1); border-color: var(--glow1); }
      25%  { box-shadow: 0 0 25px var(--glow2); border-color: var(--glow2); }
      50%  { box-shadow: 0 0 25px var(--glow3); border-color: var(--glow3); }
      75%  { box-shadow: 0 0 25px var(--glow4); border-color: var(--glow4); }
      100% { box-shadow: 0 0 25px var(--glow1); border-color: var(--glow1); }
    }
    .hacker-top-bar {
      position: fixed; top: 10px; left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 0 25px; font-family: 'Courier New', monospace;
      color: var(--hacker-color); font-size: 15px; z-index: 1000; font-weight: bold;
    }
    .theme-toggle { position: absolute; top: 15px; right: 20px; cursor: pointer; z-index: 10; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; color: var(--text-color); opacity: 0.8; }
    .theme-toggle svg { width: 100%; height: 100%; fill: currentColor; }
    .controls { display: flex; justify-content: center; gap: 15px; margin: 10px 0; align-items: center; position: relative; z-index: 15; }
    .controls button { background: none; border: none; color: inherit; cursor: pointer; transition: 0.2s; padding: 5px; display: flex; align-items: center; justify-content: center; }
    .controls svg { width: 30px; height: 30px; fill: currentColor; } 
    #play svg { width: 42px; height: 42px; } 
    .bottom-controls { display: flex; justify-content: center; margin: 5px 0; gap: 10px; position: relative; z-index: 15;}
    .bottom-controls button { 
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
      color: inherit; cursor: pointer; transition: 0.2s; padding: 6px 14px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .bottom-controls svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .output-row { display: flex; justify-content: center; margin: 10px 0 5px 0; width: 100%; position: relative; z-index: 15; }
    .bt-block-btn {
      display: flex; align-items: center; gap: 6px; font-size: 11px; 
      color: var(--glow3); font-weight: bold; padding: 5px 12px; 
      border-radius: 15px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0, 255, 204, 0.2); cursor: pointer; transition: 0.3s;
    }
    .bt-block-btn.disabled { color: #ff0000; border-color: #ff0000; }
    .bt-block-btn:active { transform: scale(0.95); }
    .bt-block-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .song-title { font-weight: bold; font-size: 18px; margin-top: 10px; min-height: 24px; position: relative; z-index: 15; }
    .song-artist { font-size: 13px; color: var(--glow3); opacity: 0.8; margin-bottom: 10px; min-height: 18px; font-style: italic; position: relative; z-index: 15; }

    /* =========================================
       VINYL & TONEARM SYSTEM (FIXED)
       ========================================= */
   .player-zone {
      margin: 10px auto; /* Kurangi margin dari 20px ke 10px */
      width: 260px;      /* Perkecil dari 300px ke 240px */
      height: 260px;     /* Perkecil dari 300px ke 240px */
      position: relative;
}
    .vinyl-stage {
      width: 100%; height: 100%;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    .vinyl-disk {
      width: 100%; height: 100%;
      border-radius: 50%;
      background-color: var(--vinyl-disk-color);
      position: absolute;
      top: 0; left: 0;
      display: flex; align-items: center; justify-content: center;
      background-image: repeating-radial-gradient(circle, #222 0%, #000 1%, #111 2%);
      transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
      z-index: 1;
    }
    .vinyl-disk.center { transform: translateX(0) rotate(0deg); opacity: 1; z-index: 2; }
    .vinyl-disk.left { transform: translateX(-150%) rotate(-120deg); opacity: 0; }
    .vinyl-disk.right { transform: translateX(150%) rotate(120deg); opacity: 0; }

    .vinyl-label { 
      width: 48%; height: 48%;
      object-fit: cover; 
      border-radius: 50%; 
      border: 3px solid #222;
      z-index: 3;
    }
    .vinyl-disk::after {
        content: ''; position: absolute; width: 10px; height: 10px;
        background: #333; border-radius: 50%; z-index: 4;
    }
    .rotate { animation: rotateVinyl 15s linear infinite; }
    @keyframes rotateVinyl { from { transform: translateX(0) rotate(0deg); } to { transform: translateX(0) rotate(360deg); } }
    .tonearm-container {

        position: absolute;
        top: 0px; right: 0px;
        width: 100px; height: 100px;
        z-index: 20;
    }
    .tonearm-base {
        position: absolute; 
        top: 15px; right: 15px;
        width: 20px; height: 20px;
        background: var(--tonearm-holder);
        border-radius: 50%; border: 2px solid #555;
        box-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }
    #tonearm-rod {
        position: absolute;
        top: 25px; right: 23px;
        width: 6px; height: 175px; /* Kurangi dari 210px menjadi sekitar 165px agar pas dengan piringan 240px */
        background: linear-gradient(to right, #777, var(--tonearm-color), #777);
        border-radius: 3px;
        transform-origin: top center;
        transform: rotate(-28deg);
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: -2px 2px 5px rgba(0,0,0,0.4);
    }
    /* Head & Jarum */
    #tonearm-rod::after {
        content: ''; position: absolute; bottom: -5px; left: -8px;
        width: 22px; height: 35px; background: #1a1a1a;
        clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
    }
    #tonearm-rod::before {
        content: ''; position: absolute; bottom: -8px; left: 2px;
        width: 2px; height: 8px; background: #eee;
    }

    .progress-info { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; width: 100%; position: relative; z-index: 15; }
    #progress { flex: 1; margin: 0 10px; cursor: pointer; accent-color: var(--glow3); height: 6px; border-radius: 5px; outline: none; }
    #playlist { list-style: none; padding: 0; max-height: 180px; overflow-y: auto; margin: 10px auto; width: 100%; background-color: var(--panel-bg); border-radius: 10px; transition: 0.4s; overscroll-behavior: contain; position: relative; z-index: 15; }
    #playlist.hidden { max-height: 0; opacity: 0; overflow: hidden; margin: 0; }
    #playlist li { padding: 10px 15px; cursor: pointer; text-align: left; font-size: 13px; border-bottom: 1px solid rgba(127,127,127,0.1); display: flex; justify-content: space-between; align-items: center; }
    #playlist li.playing { font-weight: bold; border-left: 4px solid var(--glow3); background: rgba(255,255,255,0.05); }
    .add-to-queue { font-size: 11px; color: var(--glow3); padding: 3px 6px; border: 1px solid rgba(0, 255, 204, 0.4); border-radius: 4px; transition: 0.3s; opacity: 0.6; }
    .add-to-queue:hover { background: var(--glow3); color: var(--bg-color); opacity: 1; transform: scale(1.1); }
    .add-to-queue.active { background: var(--glow3); color: var(--bg-color); opacity: 1; border-color: var(--glow3); }
    .playlist-select-container { margin: 15px auto; position: relative; width: 100%; z-index: 16;}
    .custom-dropdown-header { padding: 10px 15px; border-radius: 10px; background-color: var(--panel-bg); color: var(--text-color); border: 1px solid var(--glow1); font-size: 14px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; position: relative; }
    .custom-dropdown-header .arrow { position: absolute; right: 15px; transition: 0.3s; }
    .custom-dropdown-header .arrow.rotated { transform: rotate(-180deg); }
    .custom-dropdown-content { position: absolute; bottom: 100%; left: 0; width: 100%; background-color: var(--bg-color); border: 1px solid var(--glow2); border-radius: 10px; max-height: 0; overflow-y: auto; z-index: 999; list-style: none; padding: 0; margin-bottom: 5px; transition: all 0.3s ease; opacity: 0; }
    .custom-dropdown-content.show { max-height: 200px; opacity: 1; padding: 5px 0; }
    .custom-dropdown-content li { padding: 10px 15px; cursor: pointer; text-align: left; font-size: 13px; }
    .info-container { height: 25px; margin-top: 5px; position: relative; z-index: 15;}
    .info-text { position: absolute; left: 50%; transform: translateX(-50%); padding: 4px 12px; border-radius: 15px; background: var(--text-color); color: var(--bg-color); font-size: 11px; font-weight: bold; animation: fadeOutInfo 5s ease forwards; }
    @keyframes fadeOutInfo { 0% { opacity: 0; transform: translate(-50%, 5px); } 5% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -5px); } }
    .lyrics-container { margin-top: 20px; padding-top: 15px; min-height: 80px; border-top: 1px solid rgba(127,127,127,0.2); display: flex; justify-content: center; align-items: center; position: relative; z-index: 15;}
    #lyrics-display { font-size: 15px; font-weight: bold; color: var(--lyric-color); text-shadow: 0 0 10px var(--lyric-color); line-height: 1.5; transition: 0.3s; width: 100%; text-align: center; }
    #dropdown-toggle { background:none; border:1px solid var(--glow3); color:inherit; padding:8px 15px; border-radius:8px; cursor:pointer; margin: 10px auto; display: flex; justify-content: center; align-items: center; gap: 8px; font-weight: bold; width: 60%; transition: 0.3s; position: relative; z-index: 15;}
    #dropdown-toggle .toggle-arrow { transition: 0.3s; transform: rotate(0deg); }
    #dropdown-toggle.active .toggle-arrow { transform: rotate(-180deg); }
    @media screen and (max-height: 740px) {
  .player-zone {
    width: 200px;
    height: 200px;
  }
  #tonearm-rod {
    height: 140px;
  }
  .song-title {
    font-size: 16px;
    margin-top: 5px;
  }
  .lyrics-container {
    min-height: 50px;
  }
}

  </style>
</head>
<body onselectstart="return false">
  <div class="hacker-top-bar"><div id="clock">00:00:00</div><div id="date">Loading...</div></div>
  <div class="music-container">
    <div class="vu-meter-pro">
      <div class="vu-bar-unit"><div id="vub-mus" class="vu-bar-fill"></div><span class="vu-small-label">MUS</span></div>
      <div class="vu-bar-unit"><div id="vub-voc" class="vu-bar-fill"></div><span class="vu-small-label">VOC</span></div>
    </div>
    <div class="theme-toggle" id="theme-toggle">
      <svg id="theme-svg" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9s9-4.03 9-9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26a5.403 5.403 0 0 1-3.14-9.8c.44-.06.9-.1 1.36-.1c.46 0 .91.04 1.36.1C11.08 3.04 11.54 3 12 3z"/></svg>
    </div>
    <div id="song-title" class="song-title">Memuat...</div>
    <div id="song-artist" class="song-artist">Penyanyi</div>
    <div class="player-zone">
        <div class="vinyl-stage" id="vinyl-stage"></div>
        <div class="tonearm-container">
            <div class="tonearm-base"></div>
            <div id="tonearm-rod"></div>
        </div>
    </div>
    <div class="progress-info">
      <span id="current-time">0:00</span>
      <input type="range" id="progress" value="0" step="0.1" />
      <span id="duration">0:00</span>
    </div>
    <div class="controls">
      <button id="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button id="play"><svg viewBox="0 0 24 24" id="play-svg"><path d="M8 5.14v14l11-7-11-7z"/></svg></button>
      <button id="next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
    <div class="bottom-controls">
      <button id="mode"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3h-6z"/></svg></button>
    </div>
    <div class="output-row">
        <div class="bt-block-btn" id="bt-toggle-btn" onclick="toggleBluetoothShortcut()">
            <span id="bt-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11L12 22V2l5.5 5.5l-11 11"/></svg></span>
            <span id="bt-status-text">Bluetooth Shortcut: ON</span>
        </div>
    </div>
    <div class="info-container" id="info-container"></div>
    <div class="playlist-select-container">
        <div class="custom-dropdown-header" id="custom-playlist-header"><span id="selected-playlist-name">Pilih Playlist</span><span class="arrow">▼</span></div>
        <ul class="custom-dropdown-content" id="custom-playlist-content"></ul>
    </div>
    <button id="dropdown-toggle">Daftar Lagu <span class="toggle-arrow">▼</span></button>
    <ul id="playlist" class="hidden"></ul>
    <div class="lyrics-container"><div id="lyrics-display">Lirik akan ditampilkan disini</div></div>
  </div>
  <audio id="audio" crossorigin="anonymous"></audio>

  <script src="playlist/arabic.js"></script>
  <script src="playlist/jawa.js"></script>
  <script src="playlist/old.js"></script>
  <script src="Playlist/new.js"></script>

  <script>
    const SVG_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>';
    const SVG_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
    const SVG_SUN = '<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5s5-2.24 5-5s-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0a.996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0a.996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-12.37a.996.996 0 0 0-1.41 0l-1.06 1.06a.996.996 0 1 0 1.41 1.41l1.06-1.06c.39-.39.39-1.03 0-1.41zm-12.37 12.37a.996.996 0 0 0-1.41 0l-1.06 1.06a.996.996 0 1 0 1.41 1.41l1.06-1.06c.39-.39.39-1.03 0-1.41z"/></svg>';
    const SVG_MOON = '<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9s9-4.03 9-9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26a5.403 5.403 0 0 1-3.14-9.8c.44-.06.9-.1 1.36-.1c.46 0 .91.04 1.36.1C11.08 3.04 11.54 3 12 3z"/></svg>';
    const SVG_MODES = [
      '<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3h-6z"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/><path d="M11 10h1v3h-1z"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>'
    ];
    const SVG_BT_ON = '<svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11L12 22V2l5.5 5.5l-11 11"/></svg>';
    const SVG_BT_OFF = '<svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11L12 22V2l5.5 5.5l-11 11"/><line x1="2" y1="2" x2="22" y2="22" stroke="red" stroke-width="2"/></svg>';

    const allPlaylists = { "arabic": typeof arabicPlaylist !== 'undefined' ? arabicPlaylist : null, "jawa": typeof jawaPlaylist !== 'undefined' ? jawaPlaylist : null, "old": typeof oldPlaylist !== 'undefined' ? oldPlaylist : null, "new": typeof newPlaylist !== 'undefined' ? newPlaylist : null };
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const modeBtn = document.getElementById('mode');
    const lyricsDisplay = document.getElementById('lyrics-display');
    const songListElement = document.getElementById('playlist');
    const dropdownToggle = document.getElementById('dropdown-toggle');
    const progressBar = document.getElementById('progress');
    const barMus = document.getElementById('vub-mus');
    const barVoc = document.getElementById('vub-voc');
    const vinylStage = document.getElementById('vinyl-stage');
    const tonearmRod = document.getElementById('tonearm-rod');

    let isPlaying = false, hasStarted = false, playMode = 0, currentSongs = [], currentPlaylistName = "", activePlaylistName = "", activeSongIndex = 0;
// Ganti baris let lyricsData = [], customQueue = ... dengan ini:
let lyricsData = [], customQueue = [], playbackHistory = [], unplayedSongs = [], btShortcutEnabled = true, isChangingSong = false;
let shuffleStack = []; // Menyimpan urutan lagu yang sudah diacak
let shuffleIndex = -1; // Menunjuk posisi saat ini di dalam stack acak

    /* ANGLES: Rest (-28), Start (0 = benar benar ujung luar), End (26 = mepet cover) {besi penunjuk} */
    const ARM_ANGLES = { rest: 100, start: 1, end: 26.5 };

    function toggleBluetoothShortcut() {
        btShortcutEnabled = !btShortcutEnabled;
        const btn = document.getElementById('bt-toggle-btn'), iconWrap = document.getElementById('bt-icon-wrapper'), text = document.getElementById('bt-status-text');
        if (btShortcutEnabled) {
            btn.classList.remove('disabled'); iconWrap.innerHTML = SVG_BT_ON; text.textContent = "Bluetooth Shortcut: ON";
            showInfo("Shortcut Headset Aktif");
            const song = allPlaylists[activePlaylistName][activeSongIndex];
            if(song) updateMediaMetadata(song);
        } else {
            btn.classList.add('disabled'); iconWrap.innerHTML = SVG_BT_OFF; text.textContent = "Bluetooth Shortcut: OFF";
            showInfo("Shortcut Headset Dimatikan");
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', null); navigator.mediaSession.setActionHandler('pause', null);
                navigator.mediaSession.setActionHandler('previoustrack', null); navigator.mediaSession.setActionHandler('nexttrack', null);
            }
        }
    }

    let audioCtx, analyser, dataArray;
    function initVisualizer() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      const source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser); analyser.connect(audioCtx.destination);
      analyser.fftSize = 256; dataArray = new Uint8Array(analyser.frequencyBinCount);
      draw();
    }
    function draw() {
      requestAnimationFrame(draw);
      if(!isPlaying) { barMus.style.height = "2%"; barVoc.style.height = "2%"; return; }
      analyser.getByteFrequencyData(dataArray);
      barMus.style.height = Math.max(2, (dataArray[2] / 255) * 65) + "%";
      let vSum = 0; for(let i=10; i<40; i++) vSum += dataArray[i];
      barVoc.style.height = Math.max(2, Math.min(((vSum/30) / 255) * 85, 92)) + "%";
    }

    function updateMediaMetadata(song) {
      if ('mediaSession' in navigator && btShortcutEnabled) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.name, artist: song.artist || activePlaylistName.toUpperCase(),
          artwork: [{ src: song.cover || "https://kkykrnwn.github.io/find-me/images/icon.png", sizes: '512x512', type: 'image/png' }]
        });
        navigator.mediaSession.setActionHandler('play', playSong); navigator.mediaSession.setActionHandler('pause', pauseSong);
        navigator.mediaSession.setActionHandler('previoustrack', prevSong); navigator.mediaSession.setActionHandler('nexttrack', nextSong);
      }
    }

    audio.ontimeupdate = () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const progressPercent = audio.currentTime / audio.duration;
        progressBar.value = progressPercent * 100;
        document.getElementById('current-time').textContent = formatTime(audio.currentTime);
        document.getElementById('duration').textContent = formatTime(audio.duration);
        if(isPlaying && !isChangingSong) updateTonearmPosition(progressPercent);
      }
      if (lyricsData.length > 0) {
        const active = lyricsData.filter(l => l.time <= audio.currentTime).pop();
        if (active) lyricsDisplay.innerHTML = active.text;
      }
    };

    function updateTonearmPosition(progress) {
        const currentAngle = ARM_ANGLES.start + ((ARM_ANGLES.end - ARM_ANGLES.start) * progress);
        tonearmRod.style.transform = `rotate(${currentAngle}deg)`;
    }
    
    function setTonearmPhysicalState(stateName) {
        if(ARM_ANGLES[stateName] !== undefined) tonearmRod.style.transform = `rotate(${ARM_ANGLES[stateName]}deg)`;
    }

    function playSong() {
      if(isChangingSong) return;
      initVisualizer();
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      if(!hasStarted) { 
        const songs = allPlaylists[activePlaylistName];
        fetchLyrics(songs[activeSongIndex].src.split('/').pop().replace('.mp3', '')); 
      }
      hasStarted = true; 
      if(audio.currentTime === 0) setTonearmPhysicalState('start');
      audio.play().then(() => { 
        isPlaying = true; playBtn.innerHTML = SVG_PAUSE;
        const disk = vinylStage.querySelector('.vinyl-disk.center');
        if (disk) { disk.classList.add('rotate'); disk.style.animationPlayState = 'running'; }
      }).catch(pauseSong);
    }

    function pauseSong() { 
      audio.pause(); isPlaying = false; playBtn.innerHTML = SVG_PLAY;
      const disk = vinylStage.querySelector('.vinyl-disk.center');
      if (disk) disk.style.animationPlayState = 'paused';
    }

    /* FIX ANIMASI KELUAR MASUK */
    function loadSong(index, fromPlaylist = null, direction = 'next') {
      if(isChangingSong) return;
      isChangingSong = true;
      
      if (fromPlaylist) activePlaylistName = fromPlaylist;
      activeSongIndex = index;
      const song = allPlaylists[activePlaylistName][activeSongIndex];


if (direction === 'next' || direction === 'prev') {
    // Biarkan stack dikelola oleh fungsi nextSong/prevSong
} else {
    // Jika user klik manual dari playlist, buat jalan baru (reset shuffle stack)
    if (playMode === 3) {
        shuffleStack = [{ index: index, playlist: activePlaylistName }];
        shuffleIndex = 0;
        unplayedSongs = Array.from(Array(allPlaylists[activePlaylistName].length).keys());
        const usedIdx = unplayedSongs.indexOf(index);
        if (usedIdx > -1) unplayedSongs.splice(usedIdx, 1);
    }
}

      if (!song) { isChangingSong = false; return; }
      
      const wasPlaying = isPlaying;
      if(isPlaying) audio.pause();

      // 1. Jarum naik (Rest)
      setTonearmPhysicalState('rest');
      
      setTimeout(() => {
          const oldDisk = vinylStage.querySelector('.vinyl-disk.center');
          const slideOutClass = direction === 'next' ? 'left' : 'right';
          const slideInClass = direction === 'next' ? 'right' : 'left';

          // 2. Piringan lama keluar
          if(oldDisk) {
              oldDisk.classList.remove('center', 'rotate');
              oldDisk.classList.add(slideOutClass);
          }

          // 3. Piringan baru masuk
          const newDisk = createVinylDiskDOM(song);
          newDisk.className = `vinyl-disk ${slideInClass}`;
          vinylStage.appendChild(newDisk);

          // Force reflow
          newDisk.offsetWidth;

          newDisk.classList.remove(slideInClass);
          newDisk.classList.add('center');

          setTimeout(() => {
              if(oldDisk && oldDisk.parentNode) vinylStage.removeChild(oldDisk);
              
              audio.src = song.src;
              document.getElementById('song-title').textContent = song.name;
              document.getElementById('song-artist').textContent = song.artist || activePlaylistName.toUpperCase();
              
              if(hasStarted) fetchLyrics(song.src.split('/').pop().replace('.mp3', ''));
              else { lyricsData = []; lyricsDisplay.textContent = "Lirik akan ditampilkan disini"; }
              
              updateMediaMetadata(song);
              renderSongList();
              progressBar.value = 0;

              // 4. Jarum turun jika sudah mulai
              if(hasStarted) {
                  setTonearmPhysicalState('start');
                  setTimeout(() => {
                      isChangingSong = false;
                      playbackHistory.push({ playlist: activePlaylistName, index: activeSongIndex });
                      if(wasPlaying || hasStarted) playSong();
                  }, 600);
              } else {
                  isChangingSong = false;
              }
          }, 700);
      }, 500);
    }
    
    function createVinylDiskDOM(song) {
        const disk = document.createElement('div');
        disk.className = 'vinyl-disk';
        const label = document.createElement('img');
        label.className = 'vinyl-label';
        label.src = song.cover || "https://kkykrnwn.github.io/find-me/images/icon.png";
        label.onerror = () => label.src = "https://kkykrnwn.github.io/find-me/images/icon.png";
        disk.appendChild(label);
        return disk;
    }

function nextSong() {
  if (isChangingSong) return;
  const songs = allPlaylists[activePlaylistName];
  
  if (customQueue.length > 0) {
    const next = customQueue.shift();
    loadSong(next.index, next.playlist, 'next');
    return;
  }

  if (playMode === 3) { // MODE ACAK (SHUFFLE)
    // Jika kita sedang berada di posisi "mundur", maka maju mengikuti urutan yang sudah ada
    if (shuffleIndex < shuffleStack.length - 1) {
      shuffleIndex++;
      const nextFromStack = shuffleStack[shuffleIndex];
      loadSong(nextFromStack.index, nextFromStack.playlist, 'next');
    } else {
      // Gali lubang baru (acak lagu baru)
      if (unplayedSongs.length === 0) {
        unplayedSongs = Array.from(Array(songs.length).keys());
      }
      const randomIndex = Math.floor(Math.random() * unplayedSongs.length);
      const songIdx = unplayedSongs.splice(randomIndex, 1)[0];
      
      // Simpan ke stack agar bisa di-prev
      shuffleStack.push({ index: songIdx, playlist: activePlaylistName });
      shuffleIndex++;
      
      loadSong(songIdx, null, 'next');
    }
  } else { 
    // MODE NORMAL
    let idx = (activeSongIndex + 1) % songs.length;
    loadSong(idx, null, 'next');
  }
}


function prevSong() {
  if (isChangingSong) return;
  const songs = allPlaylists[activePlaylistName];

  if (playMode === 3) { // MODE ACAK
    if (shuffleIndex > 0) {
      shuffleIndex--;
      const prevFromStack = shuffleStack[shuffleIndex];
      loadSong(prevFromStack.index, prevFromStack.playlist, 'prev');
    } else {
      showInfo("Sudah di batas awal acak");
      // Tetap di lagu yang sama (stuck)
    }
  } else { 
    // MODE NORMAL (Naik ke musik atasnya)
    loadSong((activeSongIndex - 1 + songs.length) % songs.length, null, 'prev');
  }
}

    audio.onended = () => { 
      if (customQueue.length > 0) { nextSong(); return; }
      if (playMode === 1) { audio.currentTime = 0; playSong(); } 
      else if (playMode === 2) { audio.currentTime = 0; playSong(); } 
      else nextSong(); 
    };

    function formatTime(t) { const m = Math.floor(t / 60) || 0; const s = Math.floor(t % 60) || 0; return `${m}:${s < 10 ? '0' : ''}${s}`; }
    function showInfo(text) { const container = document.getElementById('info-container'); container.innerHTML = `<div class="info-text">${text}</div>`; }
    function closeAllMenus() { songListElement.classList.add('hidden'); dropdownToggle.classList.remove('active'); document.getElementById('custom-playlist-content').classList.remove('show'); document.getElementById('custom-playlist-header').querySelector('.arrow').classList.remove('rotated'); }

    function renderSongList() {
      songListElement.innerHTML = '';
      currentSongs.forEach((song, index) => {
        const li = document.createElement('li'), title = document.createElement('span');
        title.textContent = song.name;
        const isCur = (activePlaylistName === currentPlaylistName && index === activeSongIndex);
        li.appendChild(title);
        if (!isCur) {
          const qBtn = document.createElement('span'); qBtn.className = 'add-to-queue';
          if (customQueue.some(q => q.playlist === currentPlaylistName && q.index === index)) qBtn.classList.add('active');
          qBtn.innerHTML = '➕'; qBtn.onclick = (e) => { e.stopPropagation(); toggleQueue(currentPlaylistName, index); };
          li.appendChild(qBtn);
        }
        li.onclick = (e) => { e.stopPropagation(); if(isChangingSong) return; loadSong(index, currentPlaylistName, index > activeSongIndex ? 'next' : 'prev'); closeAllMenus(); };
        if (isCur) li.classList.add('playing');
        songListElement.appendChild(li);
      });
    }

    function toggleQueue(pName, idx) {
      const song = allPlaylists[pName][idx];
      const eIdx = customQueue.findIndex(q => q.playlist === pName && q.index === idx);
      if (eIdx > -1) { customQueue.splice(eIdx, 1); showInfo("Dibatalkan: " + song.name); } 
      else { customQueue.push({ playlist: pName, index: idx, name: song.name }); showInfo("Antrean: " + song.name); }
      renderSongList();
    }

    function populateDropdown() {
      const content = document.getElementById('custom-playlist-content');
      for (const name in allPlaylists) {
        if(!allPlaylists[name]) continue;
        const li = document.createElement('li'); li.textContent = name.toUpperCase();
        li.onclick = (e) => { e.stopPropagation(); loadPlaylist(name); closeAllMenus(); };
        content.appendChild(li);
      }
      const first = Object.keys(allPlaylists).find(k => allPlaylists[k] !== null);
      if(first) loadPlaylist(first);
    }

    function loadPlaylist(name) {
      currentPlaylistName = name; currentSongs = allPlaylists[name];
      document.getElementById('selected-playlist-name').textContent = name.toUpperCase();
      renderSongList();
      if (!hasStarted) { activePlaylistName = name; activeSongIndex = 0; loadSong(0, name, 'next'); } 
      else showInfo("Melihat Playlist: " + name.toUpperCase());
    }

    function fetchLyrics(fileName) {
      lyricsData = []; lyricsDisplay.textContent = "Mencari lirik...";
      const old = document.getElementById('dynamic-lyric'); if (old) old.remove();
      const script = document.createElement('script'); script.id = 'dynamic-lyric'; script.src = `${fileName}.js`;
      script.onerror = () => { lyricsDisplay.textContent = "Lirik tidak ditemukan"; };
      document.body.appendChild(script);
    }

    progressBar.oninput = () => { 
        if(isChangingSong || isNaN(audio.duration)) return;
        audio.currentTime = (progressBar.value / 100) * audio.duration;
        updateTonearmPosition(progressBar.value / 100);
    };
    
    dropdownToggle.onclick = (e) => { e.stopPropagation(); if (songListElement.classList.toggle('hidden')) dropdownToggle.classList.remove('active'); else { dropdownToggle.classList.add('active'); renderSongList(); } };
    document.getElementById('custom-playlist-header').onclick = (e) => { e.stopPropagation(); const show = document.getElementById('custom-playlist-content').classList.toggle('show'); document.getElementById('custom-playlist-header').querySelector('.arrow').classList.toggle('rotated', show); };
    document.addEventListener('click', closeAllMenus);
    playBtn.onclick = () => { isPlaying ? pauseSong() : playSong(); };
    document.getElementById('next').onclick = nextSong;
    document.getElementById('prev').onclick = prevSong;
    document.getElementById('theme-toggle').onclick = () => { const isL = document.body.classList.toggle('light'); document.getElementById('theme-toggle').innerHTML = isL ? SVG_SUN : SVG_MOON; };
    modeBtn.onclick = () => { playMode = (playMode + 1) % 4; const texts = ['🎶 Berurutan', '🔂 Ulang 1x', '🔁 Ulang Terus', '🔀 Acak']; showInfo(texts[playMode]); modeBtn.innerHTML = SVG_MODES[playMode];

    // Reset data acak setiap kali mode berubah ke acak atau dari acak
    shuffleStack = [];
    shuffleIndex = -1;
    if (playMode === 3) {
        shuffleStack.push({ index: activeSongIndex, playlist: activePlaylistName });
        shuffleIndex = 0;
        unplayedSongs = Array.from(Array(allPlaylists[activePlaylistName].length).keys());
        const usedIdx = unplayedSongs.indexOf(activeSongIndex);
        if (usedIdx > -1) unplayedSongs.splice(usedIdx, 1);
    }
  };

    function updateDateTime() { const now = new Date(); document.getElementById("clock").textContent = now.toLocaleTimeString('id-ID'); document.getElementById("date").textContent = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'numeric', year: 'numeric' }); }
    setInterval(updateDateTime, 1000);
    populateDropdown();
  </script>
</body>
